<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatchR — Changelog</title>
  <script>
    // Thème appliqué avant le rendu (évite le flash clair/sombre)
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); } catch (e) {}
  </script>
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* La page ne garde QUE son ossature : le journal est rendu par
       <naerod-changelog> (depot naerod-ui), styles compris. */
    .cl-main { max-width: 760px; margin: 0 auto; padding: 2rem 0 3rem; }
    .cl-back { display: inline-flex; align-items: center; gap: .35rem; color: var(--text-dim);
               font-size: .9rem; margin: 0 0 1.25rem 1rem; }
    .cl-back:hover { color: var(--accent); }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  </style>
  <!-- Umami analytics (self-hosted, sans cookie) -->
  <script defer src="https://umami.naerod.com/s.js" data-website-id="70965d58-5f61-4e31-88ca-8496e3d6df93"></script>
</head>
<body>
  <!-- En-tete unifie (depot naerod-ui) — cette page servait auparavant sa
       propre copie du header : c est exactement ce qu on supprime. -->
  <naerod-header site="catchr"></naerod-header>

  <main class="cl-main">
    <a href="/" class="cl-back"><span class="material-symbols-outlined">arrow_back</span><span data-i18n="cl_back">Back to the calculator</span></a>
    <naerod-changelog src="/changelog.json"></naerod-changelog>
  </main>

  <footer>
    <p>CatchR — PokeMMO community tool — <span data-i18n="footer_disclaimer">not affiliated with PokeMMO</span>
      · <naerod-version src="/changelog.json"></naerod-version></p>
  </footer>

  <script src="/js/i18n.js"></script>
  <script type="module" src="https://static.dorianjulien.com/ui/header/v1.js"></script>
</body>
</html>
